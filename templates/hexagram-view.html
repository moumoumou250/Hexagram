<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>京房 · 六爻卦盘</title>
<style>
:root{color-scheme:light;--paper:#f6f3e9;--card:#fffdf7;--ink:#243b32;--muted:#52645a;--line:#dedfd1;--jade:#24483c;--rust:#9e412b;--rust-bg:#f8e9df}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Microsoft YaHei","PingFang SC",sans-serif}
main{max-width:1140px;margin:auto;padding:24px 34px 54px}
h1,h2,h3,.brand{font-family:"Noto Serif SC","Songti SC",SimSun,serif}
h1,h2,h3,p{margin:0}
.top,.section-title{display:flex;align-items:center;gap:12px}
.top,.section-title{justify-content:space-between}
.top{margin-bottom:18px}
.brand{font-size:24px;font-weight:bold;letter-spacing:.08em}
.jump{background:var(--card);border:1px solid #aeb9ab;border-radius:7px;padding:7px 11px;color:var(--jade);text-decoration:none;white-space:nowrap}
:focus-visible{outline:3px solid #b76d34;outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.reading-info{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0 0 16px;padding:12px 18px}
.reading-info div{display:flex;flex-wrap:wrap;gap:0 8px}
.reading-info .question{flex-basis:100%;font-weight:bold;overflow-wrap:anywhere}
.reading-info dt{color:var(--muted)}
.reading-info dd{margin:0;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;padding:24px 30px;background:#1d3b34;background-image:radial-gradient(ellipse at 75% 110%,#386455,transparent 70%);color:#fff9ea}
.hero.static{grid-template-columns:minmax(0,1fr)}
.identity{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.identity small{color:#ded6b6;letter-spacing:.13em}
.hero h1,.hero h2{font-size:clamp(25px,4vw,43px);line-height:1.3;letter-spacing:.06em;margin:3px 0 6px}
.hero p{color:#e4eadd;font-size:13px}
.symbol{display:grid;gap:5px;color:#e5c994}
.bar{display:inline-block;width:38px;height:6px;border-radius:1px;background:currentColor;flex:none}
.symbol .bar{width:58px}
.bar.yin{background:linear-gradient(to right,currentColor 42%,transparent 42% 58%,currentColor 58%)}
.symbol .bar.hot{color:#ffd4ae}
.arrow{color:#ecd1a4;font-size:23px}
.chart-body,.analysis{padding:18px 24px 22px}
.section-title{align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.section-title h2{font-size:25px}
.muted{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#edf0e7;color:#41564b;font-weight:bold;font-size:13px}
.chart-table{white-space:nowrap}
.chart-table tbody th{background:transparent;color:inherit;text-align:left;font-size:inherit;font-weight:normal}
.chart-table tr:nth-child(3) > *{border-bottom:2px solid #aab8aa}
.chart-table tr.moving > *{background:#fbefe6}
.chart-table tr.moving > :first-child{box-shadow:inset 3px 0 var(--rust)}
.line-name{display:inline-grid;grid-template-columns:auto 2em auto;align-items:center;gap:8px}
.line-name .relative{font-weight:bold}
.line-status{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.marker{display:inline-block;padding:0 5px;border-radius:4px;background:#e6eee2;color:#345344;font-size:12px;font-weight:bold}
.marker.hot{background:#f1d8ca;color:#86341f}
.role-shi{--role-bg:#e3eee5;--role-ink:#194b39}
.role-ying{--role-bg:#f3ead9;--role-ink:#694617}
.role-badge{display:inline-block;white-space:nowrap;border-radius:5px;background:var(--role-ink);color:white;font-weight:bold;padding:2px 7px;font-size:12px}
.chart-table tr:is(.role-shi,.role-ying) > *{background:var(--role-bg)}
.chart-table tr:is(.role-shi,.role-ying) > :first-child{box-shadow:inset 3px 0 var(--role-ink);color:var(--role-ink)}
.chart-table tr.moving:is(.role-shi,.role-ying) .changed-line{background:#fbefe6}
.analysis{margin-top:16px}
.summary{background:#e9eee4;border-left:4px solid #416955;padding:13px 16px;border-radius:0 9px 9px 0}
.summary h4{margin:0 0 4px;color:#365548;font-size:13px}
.summary p{font-size:clamp(16px,2.4vw,21px);font-weight:700;line-height:1.5}
.reason{min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:9px}
.reason h3{font-size:19px;margin-bottom:5px}
.evidence{white-space:nowrap}
.evidence td{vertical-align:top}
.evidence .detail{display:block;color:var(--muted);font-size:12px}
.interpretation{margin-top:12px}
.reading-section{margin-top:18px}
.reading-section h4{font-size:17px;margin:0 0 8px}
#key-points-block{border:1px solid #d8e1d5;border-radius:10px}
.key-points{min-width:680px;font-size:13px;line-height:1.5}
.key-points thead th{background:#28493d;color:#fffdf7;font-weight:600;white-space:nowrap}
.key-points th,.key-points td{padding:10px 11px;vertical-align:middle}
.key-points tbody th{background:var(--card);color:var(--ink);white-space:nowrap}
.key-points tbody tr:nth-child(even) > *{background:#f7f8f2}
.key-points tbody tr[data-role="用神"] > *{background:#e9f0e6}
.key-points tbody tr[data-role="用神"] th{box-shadow:inset 3px 0 #487259}
.key-points tbody tr:last-child > *{border-bottom:0}
.key-points .object-name{font-weight:600}
.key-points .force-status{display:inline-block;border-radius:4px;padding:2px 6px;background:#edf0e9;color:#44564d;font-weight:700}
.key-points .force-status[data-force="有力"]{background:#dceadf;color:#224e34}
.key-points .force-status[data-force="无力"],.key-points .force-status[data-limited]{background:#f5ebd8;color:#744823}
.matrix-scroll-hint{display:none;margin-top:6px}
@media(max-width:760px){.key-points tr > :first-child{position:sticky;left:0;z-index:1}.key-points tr[data-role="用神"] th{box-shadow:inset 3px 0 #487259,1px 0 #d8e1d5}#key-points-block:not([hidden])+.matrix-scroll-hint{display:block}}
.basis-list{margin:0;border-top:1px solid var(--line)}
.basis-list div{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.basis-list dt{font-weight:700;color:var(--jade)}
.basis-list dd{margin:0;overflow-wrap:anywhere}
.compact-list{margin:6px 0 0;padding-inline-start:1.25em}
.compact-list li+li{margin-top:4px}
.verdict-layers{display:grid;gap:7px;list-style:none;margin:0;padding:0}
.verdict-layers li{display:grid;grid-template-columns:4.7em minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:7px}
.layer-status{display:inline-block;padding:1px 5px;border-radius:4px;background:#eeeee7;color:#45574b;text-align:center;font-size:12px;font-weight:700}
.layer-status.met{background:#dfeee4;color:#22543c}
.layer-status.waiting{background:#f5ebd6;color:#714b21}
.layer-status.unlikely{background:var(--rust-bg);color:#86341f}
.layer-condition{display:block;color:var(--muted);margin-top:2px}
.falsifier{margin-top:8px;padding:9px 11px;border:1px solid #e8cdbf;border-left:3px solid var(--rust);border-radius:0 7px 7px 0;background:#fbf2ea}
.falsifier strong{display:block;color:#86341f}
.review-details,#strength-reading,#summary-pending{margin-top:10px}
.review-details summary{cursor:pointer;color:var(--jade);font-weight:bold}
.review-details[open] summary{margin-bottom:8px}
.source{margin-top:12px;color:var(--muted);font-size:12px}
[hidden]{display:none!important}
@media(max-width:760px){main{padding:14px 12px 30px}.hero{padding:18px 15px;gap:10px}.identity{gap:7px}.hero h1,.hero h2{letter-spacing:0;font-size:clamp(17px,4.6vw,29px)}.hero p{font-size:11px}.symbol .bar{width:26px;height:4px}.symbol{gap:4px}.chart-body,.analysis{padding:14px}.reason{padding:10px}.brand{font-size:19px}.jump{font-size:13px;padding:5px 8px}.chart-table th,.chart-table td{padding:7px 5px}.line-name{gap:5px}.line-name .bar{width:24px}.role-badge,.marker{padding-inline:4px}}
@media print{body{background:white}main{max-width:none;padding:0}.jump{display:none}.panel{break-inside:avoid}.hero{print-color-adjust:exact}}
</style>
</head>
<body>
<main>

  <dl class="panel reading-info" aria-label="排盘资料">
    <div class="question"><dt>所问事项</dt><dd id="question"></dd></div>
    <div><dt>月建</dt><dd id="month"></dd></div>
    <div><dt>日辰</dt><dd id="day"></dd></div>
    <div><dt>主用神</dt><dd id="primary"></dd></div>
  </dl>
  <article class="panel" aria-label="详细卦盘">
    <header class="hero" id="hero"></header>
    <section class="chart-body" id="board-section" aria-labelledby="board-title">
      <div class="section-title"><h2 id="board-title">六爻对照</h2><p class="muted">上爻在上，初爻在下 · ○ 阳动，× 阴动</p></div>
      <div class="scroll" tabindex="0" role="region" aria-label="六爻排盘表"><table class="chart-table" id="board"></table></div>
    </section>
  </article>
  <section class="panel analysis" id="analysis" aria-labelledby="analysis-title">
    <div class="section-title"><h2 id="analysis-title">关键判断与依据</h2><p class="muted" id="case-label"></p></div>
    <article class="reason">
      <h3 id="strength-title">月日与旺衰</h3>
      <div class="scroll" tabindex="0" role="region" aria-labelledby="strength-title">
        <table class="evidence" id="strength">
          <thead><tr><th scope="col">爻位与纳甲</th><th scope="col">角色</th><th scope="col">月令</th><th scope="col">月建对爻</th><th scope="col">日辰对爻</th><th scope="col">旬空</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
    <article class="reason interpretation" aria-labelledby="interpretation-title">
      <h3 id="interpretation-title">解读</h3>
      <section class="summary" aria-labelledby="inferred-title">
        <h4 id="inferred-title">一句话核心结论</h4>
        <p id="summary"></p>
      </section>
      <p class="muted" id="summary-pending" hidden></p>
      <section class="reading-section" aria-labelledby="fixed-title">
        <h4 id="fixed-title">用神与世应</h4>
        <div class="scroll" id="key-points-block" tabindex="0" role="region" aria-labelledby="fixed-title" hidden>
          <table class="key-points" id="key-points" aria-labelledby="fixed-title">
            <thead><tr><th scope="col">判断项目</th><th scope="col">对象</th><th scope="col">月建影响</th><th scope="col">日辰影响</th><th scope="col">当前状态</th><th scope="col">力度评估</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="muted matrix-scroll-hint">左右滑动可查看完整表格。</p>
        <p class="muted" id="strength-reading" hidden></p>
      </section>
      <section class="reading-section" id="basis-block" aria-labelledby="basis-title" hidden>
        <h4 id="basis-title">关键判断依据</h4>
        <dl class="basis-list" id="basis-list"></dl>
        <details class="review-details" id="review-details" hidden>
          <summary>查看详细判断</summary>
          <p id="summary-detail" hidden></p>
          <ul class="compact-list" id="reading-notes" hidden></ul>
        </details>
      </section>
      <section class="reading-section" id="windows-block" aria-labelledby="windows-title" hidden>
        <h4 id="windows-title">应期通道</h4>
        <p class="muted">以下均为候选通道。</p>
        <ul class="compact-list" id="windows-lines"></ul>
      </section>
      <section class="reading-section" id="verdict-block" aria-labelledby="verdict-title" hidden>
        <h4 id="verdict-title">分层与证伪</h4>
        <ul class="verdict-layers" id="verdict-layers"></ul>
        <div class="falsifier" id="falsifier-block" hidden>
          <strong>证伪条件</strong>
          <p id="falsifier-line"></p>
        </div>
      </section>
    </article>
    <p class="source" id="source"></p>
    <p class="source" id="disclaimer"></p>
  </section>
  <noscript><p>请启用 JavaScript 查看卦盘。</p></noscript>
</main>

<script>
"use strict";
const byId = id => document.getElementById(id);
const data = JSON.parse(byId("chart-data").textContent);
const reading = JSON.parse(byId("reading-data").textContent);
const positions = ["初", "二", "三", "四", "五", "上"];
const label = position => positions[position - 1] + "爻";
const number = id => String(id).padStart(2, "0");
const bar = (polarity, hot = false) => `<i class="bar ${polarity === "阴" ? "yin" : ""} ${hot ? "hot" : ""}" aria-hidden="true"></i>`;
const tag = (text, hot = false) => text ? `<span class="marker ${hot ? "hot" : ""}">${text}</span>` : "";
const lineData = line => `${line.relative} ${line.stem || ""}${line.branch}${line.element}`;

function identity(chart, type, heading, changes) {
  const symbol = [...chart.lines].reverse().map(line => bar(line.polarity, changes[line.position])).join("");
  const attribute = chart.hexagram_relation === "无" ? "" : ` · ${chart.hexagram_relation}`;
  return `<div class="identity"><div class="symbol" aria-hidden="true">${symbol}</div><div>
    <small>${type} · 第 ${number(chart.hexagram_id)} 卦</small><${heading}>${chart.name}</${heading}>
    <p>上${chart.upper_trigram}下${chart.lower_trigram} · ${chart.palace}宫${chart.palace_element} · ${chart.palace_stage}${attribute}</p></div></div>`;
}

function focusLine(choice) {
  const {position, source} = choice;
  const baseLine = data.base.lines[position - 1];
  switch (source) {
    case "base": return baseLine;
    case "hidden": return {...choice, stem: baseLine.hidden_stem, relative: baseLine.hidden_relative, source: "伏神"};
    case "changed": return {...choice, stem: data.changed.lines[position - 1].stem, relative: data.moving[position], source: "变爻"};
    case "month": return {...choice, relative: reading.role, source: "月建"};
    case "day": return {...choice, relative: reading.role, source: "日辰"};
  }
}

function focusName(line) {
  return `${line.position ? label(line.position) : ""}${line.source || ""}${lineData(line)}`;
}

function chartLine(line, relative, caption = "") {
  return `<span class="line-name">${caption}${bar(line.polarity)}<strong class="relative">${relative}</strong><span>${line.stem}${line.branch}${line.element}</span></span>`;
}

function renderBoard(baseChart, changedChart, moving, selected) {
  const rows = [...baseChart.lines].reverse().map(line => {
    const pos = line.position;
    const change = moving[pos];
    const roleStyle = line.shi_ying === "世" ? "role-shi" : line.shi_ying === "应" ? "role-ying" : "";
    const roleBadge = roleStyle ? `<span class="role-badge">${line.shi_ying}爻</span>` : "";
    const next = changedChart?.lines[pos - 1];
    const isFocus = selected?.position === pos;
    const changedFocus = isFocus && selected.source === "变爻";
    const focusTag = isFocus && !changedFocus ? tag(selected.source === "伏神" ? "伏用" : "用", true) : "";
    const status = [roleBadge, focusTag, change ? tag(line.polarity === "阳" ? "○ 动" : "× 动", true) : ""].join("");
    const target = change
      ? chartLine(next, change) + (changedFocus ? " " + tag("用", true) : "")
      : next && `<span class="line-name">${bar(next.polarity)}<span>—</span></span>`;
    const caption = `<span class="sr-only">${line.line_title} ${line.polarity}爻</span>`;
    return `<tr class="${roleStyle} ${change ? "moving" : ""}" data-position="${pos}">
      <th scope="row">${chartLine(line, line.relative, caption)}</th>
      <td><div class="line-status">${status || "—"}</div></td>
      ${next ? `<td class="changed-line">${target}</td>` : ""}</tr>`;
  });
  byId("board").innerHTML = `<thead><tr><th scope="col">本卦六亲</th><th scope="col">世应与动静</th>
    ${changedChart ? '<th scope="col">变卦六亲</th>' : ""}</tr></thead><tbody>${rows.join("")}</tbody>`;
}

function interaction(branch, target, period) {
  if (!branch) return "—";
  const hit = data.interactions[branch + target];
  const relation = {生:"生爻", 克:"克爻", 被生:"爻生" + period, 被克:"爻克" + period, 比和:"比和"};
  return [hit.same_branch ? "临" + period : relation[hit.wuxing],
    hit.chong && (period === "月建" ? "月冲（月破）" : "日冲"), hit.he && "合", hit.target_stage].filter(Boolean).join(" · ");
}

function strengthValues(line, dayBranch, voidBranches) {
  return [data.strength[line.element] || "—",
    interaction(reading.month, line.branch, "月建"), interaction(dayBranch, line.branch, "日辰"),
    voidBranches ? (voidBranches.includes(line.branch) ? "空" : "—") : "待核"];
}

function renderList(id, texts) {
  const list = byId(id);
  list.replaceChildren(...texts.map(text => {
    const item = document.createElement("li");
    item.textContent = text;
    return item;
  }));
  list.hidden = !texts.length;
}

function renderStrength(chart, candidates, selected) {
  const body = byId("strength").tBodies[0];
  if (!chart) {
    body.innerHTML = Array.from({length: 6}, (_, index) => `<tr data-position="${6 - index}">
      <td>${label(6 - index)} · 待核</td>${"<td>—</td>".repeat(5)}</tr>`).join("");
    return ["六爻纳甲待核"];
  }

  const rows = chart.lines.map(line => [{line, names: []}]);
  const extras = [];
  const missing = [];
  function addRole(name, line) {
    const group = line.position ? rows[line.position - 1] : extras;
    let entry = group.find(item => item.line.source === line.source);
    if (!entry) {
      entry = {line, names: []};
      group.push(entry);
    }
    entry.names.push(name);
  }
  addRole("世爻", chart.lines[chart.shi_line - 1]);
  addRole("应爻", chart.lines[chart.ying_line - 1]);
  if (selected) addRole("主用神", selected);
  else candidates.forEach(line => addRole("用神候选", line));

  const roles = data.roles;
  if (roles) {
    for (const [key, name] of [["yuanshen", "原神"], ["jishen", "忌神"], ["choushen", "仇神"]]) {
      const relative = roles[key];
      const visible = chart.lines.filter(line => line.relative === relative);
      if (visible.length) {
        visible.forEach(line => addRole(name, line));
      } else {
        const hidden = chart.lines.find(line => line.hidden_relative === relative);
        if (hidden) addRole(name, {position: hidden.position, source: "伏神", stem: hidden.hidden_stem,
          branch: hidden.hidden_branch, element: hidden.hidden_element, relative});
        else if (name !== "仇神") missing.push(`${name}${relative}本卦未现`);
      }
    }
  }

  const dayBranch = data.day?.branch || reading.dayBranch;
  const voidBranches = data.day && [data.day.kong_1, data.day.kong_2];
  const ordered = [...rows].reverse().map(group => group.map(entry => ({
    ...entry, values: strengthValues(entry.line, dayBranch, voidBranches)
  })));
  body.innerHTML = ordered.map(group => {
    const entries = group.map(({line, names, values}) => [
      line.source ? `${line.source} · ${lineData(line)}` : focusName(line), names.join(" · ") || "—", ...values
    ]);
    const [main, ...details] = entries;
    const cells = main.map((value, index) => `<td>${value}${details.map(detail =>
      `<span class="detail">${detail[index]}</span>`).join("")}</td>`);
    return `<tr data-position="${group[0].line.position}">${cells.join("")}</tr>`;
  }).join("");

  return [!reading.month && "月建待核", !dayBranch && "日辰待核", !voidBranches && "旬空待核", ...missing].filter(Boolean);
}

function renderKeyPoints(selected, conclusions, gaps) {
  const results = [];
  const forces = reading.month && reading.day ? conclusions.forces_lines || [] : [];
  const voids = data.day ? [data.day.kong_1, data.day.kong_2] : [];
  const dayBranch = data.day?.branch || reading.dayBranch;
  const labels = {用神:"用神", 原神:"原神生用", 忌神:"忌神克用", 世爻:"世爻", 应爻:"应爻"};

  function influence(branch, period, line, reasons) {
    if (!branch) return "待核";
    const hit = data.interactions[branch + line.branch];
    if (!hit) return "待核";
    const monthly = period === "月";
    const relation = {生:"生扶", 克:"克制", 被生:"受爻所生", 被克:"不生扶（受爻所克）", 比和:"比和"};
    const direction = hit.same_branch ? "临爻" : relation[hit.wuxing];
    const clash = hit.chong && (monthly ? "月破" : reasons.includes("日破") ? "日冲（日破）" : "日冲");
    const state = monthly && data.strength?.[line.element];
    const stage = hit.target_stage === "墓" ? reasons.includes("入墓") ? "入墓" : "见墓" : hit.target_stage;
    const effects = [clash, direction, hit.he && "相合", stage, state].filter(Boolean);
    return effects.length ? `${branch}${period} · ${effects.join(" · ")}` : `${branch}${period} · 待核`;
  }

  function addForce(role, line, force) {
    const reasons = force?.reasons || [];
    const root = role === "用神" && forces.length && conclusions.primary_rooted;
    const moving = !line.source && Boolean(data.moving[line.position]);
    const state = [moving && "明动", voids.includes(line.branch) && !reasons.includes("真空") && "旬空",
      ...reasons.filter(reason => !["动", "非动", "无明显旺衰偏倚"].includes(reason)), root].filter(Boolean);
    if (!state.length && !line.source && reading.mask != null) state.push("静爻");
    const forceLevel = force?.force;
    const outcomes = {用神:{有力:"自身有力"}, 原神:{有力:"能生扶用神", 无力:"当前不能生"}, 忌神:{有力:"能克制用神", 无力:"当前不能克"}};
    const limited = forceLevel === "有力" && reasons.includes("月破") && !data.interactions[(dayBranch || "") + line.branch]?.same_branch;
    const outlook = limited ? "有力，暂受月破" : outcomes[role]?.[forceLevel] || forceLevel || "力度待核";
    results.push({role, object:focusName(line), month:influence(reading.month, "月", line, reasons),
      day:influence(dayBranch, "日", line, reasons), state:[...new Set(state)].join(" · ") || "待核",
      outlook, forceLevel, limited});
  }

  if (selected) {
    addForce("用神", selected, forces.find(line => line.role === "用神"));
    for (const role of ["原神", "忌神"]) {
      const entries = forces.filter(line => line.role === role);
      const relative = data.roles?.[role === "原神" ? "yuanshen" : "jishen"];
      for (const force of entries) {
        addForce(role, data.base.lines[force.position - 1], force);
      }
      if (!entries.length) {
        const knownLines = relative ? data.base.lines.filter(line => line.relative === relative) : [];
        const hiddenLine = relative && data.base.lines.find(line => line.hidden_relative === relative);
        if (knownLines.length) knownLines.forEach(line => addForce(role, line));
        else if (hiddenLine) addForce(role, focusLine({source:"hidden", position:hiddenLine.position,
          branch:hiddenLine.hidden_branch, element:hiddenLine.hidden_element}));
        else results.push({role, object:relative || "待核", month:"—", day:"—",
          state:relative ? "本卦未见" : "待核", outlook:"作用待核"});
      }
    }
  }
  if (data.base) {
    for (const [role, position] of [["世爻", data.base.shi_line], ["应爻", data.base.ying_line]]) {
      addForce(role, data.base.lines[position - 1], forces.find(line => line.position === position));
    }
  }

  const body = byId("key-points").tBodies[0];
  for (const {role, object, month, day, state, outlook, forceLevel, limited} of results) {
    const row = body.insertRow();
    row.dataset.role = role;
    const heading = document.createElement("th");
    heading.scope = "row";
    heading.textContent = labels[role];
    row.append(heading);
    row.insertCell().textContent = object;
    row.cells[1].className = "object-name";
    for (const value of [month, day, state]) row.insertCell().textContent = value;
    const badge = document.createElement("span");
    badge.className = "force-status";
    if (forceLevel) badge.dataset.force = forceLevel;
    badge.toggleAttribute("data-limited", Boolean(limited));
    badge.textContent = outlook;
    row.insertCell().append(badge);
  }
  byId("key-points-block").hidden = !results.length;
  const pending = [...gaps];
  if (!selected && data.base) pending.push("主用神待定");
  byId("strength-reading").textContent = pending.length ? pending.join("、") + "。" : "";
  byId("strength-reading").hidden = !pending.length;
  return results;
}

function describeChange(selected, move) {
  if (!move) {
    return reading.mask === 0 ? "本卦无明动爻，按静卦看。"
      : reading.mask == null ? "动爻待核。" : "用神无同位动变记录，结合相关动爻判断。";
  }
  const voids = data.day ? [data.day.kong_1, data.day.kong_2] : [];
  const target = move.changed_branch + move.changed_element;
  const effect = {
    "动生变": `${selected.branch}${selected.element}生${target}，用神耗力`,
    "动克变": `用神克变爻${target}`,
    "回头生": `变爻${target}反过来生用神`,
    "回头克": `变爻${target}反过来克用神`,
    "比和": "用神与变爻同五行",
  }[move.huitou];
  return [`${selected.branch}${selected.element} → ${target}（${move.changed_relative}）`, effect,
    move.hua_he && "同位变爻相合", move.hua_chong && "同位变爻相冲", move.jin_tui && `化${move.jin_tui}`,
    move.hua_stage && `化${move.hua_stage}`, voids.includes(move.changed_branch) && "化旬空"].filter(Boolean).join(" · ");
}

function renderBasis(selected, points, interp) {
  const rows = [];
  if (selected) {
    const {branch, element} = selected;
    const dayBranch = data.day?.branch || reading.dayBranch;
    const [monthly, monthEffect, dayEffect, kong] = strengthValues(selected, dayBranch,
      data.day && [data.day.kong_1, data.day.kong_2]);
    const related = points.filter(({role}) => role === "原神" || role === "忌神");
    const relatedText = related.map(({role, object, outlook}) => `${role}${object}，${outlook}`);
    rows.push(
      ["月建", reading.month ? `${reading.month}月 · 用神${branch}${element}月令${monthly} · ${monthEffect}` : "月建待核。"],
      ["日辰", dayBranch ? `${reading.day || dayBranch}日 · 用神${branch}${element} · ${dayEffect}` : "日辰待核。"],
      ["旬空", data.day ? `${data.day.kong_1}、${data.day.kong_2}空 · 用神${branch}${kong === "空" ? "逢空" : "不空"}` : "旬空待核。"],
      ["动变", describeChange(selected, interp.conclusions?.primary_change)],
      ["原忌神", relatedText.join("；") || "原神、忌神的作用待核。"],
    );
  }
  const list = byId("basis-list");
  for (const [name, value] of rows) {
    const row = document.createElement("div");
    const title = document.createElement("dt");
    const detail = document.createElement("dd");
    title.textContent = name;
    detail.textContent = value;
    row.append(title, detail);
    list.append(row);
  }
  list.hidden = !rows.length;

  const notes = (reading.notes || []).map(note => note.text);
  notes.push(...(interp.preset_blocks || [])
    .filter(block => !block.derived && !["X01", "X02"].includes(block.id))
    .map(block => block.text));
  renderList("reading-notes", notes);
  const hasLongSummary = reading.summary !== byId("summary").textContent;
  byId("summary-detail").textContent = hasLongSummary ? reading.summary : "";
  byId("summary-detail").hidden = !hasLongSummary;
  const hasDetails = notes.length > 0 || hasLongSummary;
  byId("review-details").hidden = !hasDetails;
  byId("basis-block").hidden = !rows.length && !hasDetails;
}

function renderVerdict(conclusions) {
  const layers = conclusions.verdict_layers || reading.verdict_layers || [];
  const list = byId("verdict-layers");
  for (const layer of layers) {
    const item = document.createElement("li");
    const status = document.createElement("strong");
    const state = {"已备":"met", "已具备":"met", "待时":"waiting", "难成":"unlikely"}[layer.status];
    status.className = "layer-status";
    if (state) status.classList.add(state);
    status.textContent = state === "met" ? "已具备" : layer.status || "待核";
    const content = document.createElement("div");
    const name = document.createElement("strong");
    name.textContent = layer.name;
    const condition = document.createElement("span");
    condition.className = "layer-condition";
    condition.textContent = layer.condition || "";
    content.append(name, condition);
    item.append(status, content);
    list.append(item);
  }
  list.hidden = !layers.length;
  const falsifier = conclusions.falsifier || reading.falsifier || "";
  byId("falsifier-line").textContent = falsifier;
  byId("falsifier-block").hidden = !falsifier;
  byId("verdict-block").hidden = !layers.length && !falsifier;
}

function showReading() {
  const {base, changed, moving} = data;
  const selected = base && reading.primary && focusLine(reading.primary);
  byId("question").textContent = reading.question;
  byId("month").textContent = reading.month ? reading.month + "月" : "待核";
  byId("day").textContent = reading.day ? reading.day + "日"
    : reading.dayBranch ? reading.dayBranch + "日（天干待核）" : "待核";
  byId("primary").textContent = selected ? focusName(selected) : reading.role ? `${reading.role}（爻位待核）` : "待核";

  const hero = byId("hero");
  hero.classList.toggle("static", !changed);
  byId("board-section").hidden = !base;
  if (base) {
    hero.innerHTML = identity(base, "本卦", "h1", moving) + (changed
      ? '<span class="arrow" aria-hidden="true">→</span>' + identity(changed, "变卦", "h2", moving) : "");
    renderBoard(base, changed, moving, selected);
  } else {
    hero.innerHTML = "<div><h1>盘面待核</h1><p></p></div>";
    hero.querySelector("p").textContent = reading.baseName || "";
  }
  const gaps = renderStrength(base, base ? reading.candidates.map(focusLine) : [], selected);

  byId("case-label").textContent = reading.label || "本次解读 · " + reading.status;
  byId("source").textContent = reading.source;
  byId("disclaimer").textContent = reading.disclaimer || "";

  const interp = reading.interpretation || {};
  const conclusions = interp.conclusions || {};
  const summary = reading.summary.trim();
  const firstSentence = summary.match(/^[^。！？]+[。！？]/u)?.[0] || summary;
  byId("summary").textContent = firstSentence;
  const pending = reading.pending || [];
  byId("summary-pending").textContent = pending.join(" ");
  byId("summary-pending").hidden = !pending.length;
  const points = renderKeyPoints(selected, conclusions, gaps);
  renderBasis(selected, points, interp);

  const windowLines = (conclusions.windows || []).map(item =>
    `${item.branch}${item.unit} · ${(item.channels || []).join("、") || "通道待核"}${item.confidence === "high" ? "（多条通道吻合）" : ""}`
  );
  byId("windows-block").hidden = !windowLines.length;
  renderList("windows-lines", windowLines);

  renderVerdict(conclusions);
}

showReading();
</script>
</body>
</html>
