[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jingfang"
version = "5.0.0"
description = "Jingfang v5 local CLI for sequential Liu Yao readings"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
jingfang = "jingfang.__main__:main"

[tool.setuptools.packages.find]
include = ["jingfang*"]
